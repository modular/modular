[pytest]
asyncio_mode = auto
# pytest_lsp triggers deprecation warnings in pytest, so we remove them to reduce noise.
filterwarnings =
    ignore::DeprecationWarning
addopts = --color=yes -n auto --reruns 5 --reruns-delay 1
timeout = 200

log_cli_format = %(asctime)s %(levelname)s %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_cli_level = INFO
