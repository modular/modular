  <g transform="translate(0,-40)"><text x="680" y="54" font-family="'Roboto Mono', monospace" font-size="14" fill="#020c13" text-anchor="start" font-weight="600" dominant-baseline="middle">Visible to</text><rect x="280.0" y="70" width="240" height="56" rx="6" fill="#f2f3f3" stroke="#d4dae4" stroke-width="1.5"/><text x="400" y="98.0" font-family="'Roboto Mono', monospace" font-size="16" fill="#020c13" text-anchor="middle" font-weight="600" dominant-baseline="middle">Registers</text><text x="680" y="98.0" font-family="'Roboto Mono', monospace" font-size="14" fill="#676d71" text-anchor="start" font-weight="500" dominant-baseline="middle">one thread</text><rect x="240.0" y="140" width="320" height="56" rx="6" fill="#f2f3f3" stroke="#d4dae4" stroke-width="1.5"/><text x="400" y="168.0" font-family="'Roboto Mono', monospace" font-size="16" fill="#020c13" text-anchor="middle" font-weight="600" dominant-baseline="middle">Shared memory</text><text x="680" y="168.0" font-family="'Roboto Mono', monospace" font-size="14" fill="#676d71" text-anchor="start" font-weight="500" dominant-baseline="middle">threads in one block</text><rect x="200.0" y="210" width="400" height="56" rx="6" fill="#f2f3f3" stroke="#d4dae4" stroke-width="1.5"/><text x="400" y="238.0" font-family="'Roboto Mono', monospace" font-size="16" fill="#020c13" text-anchor="middle" font-weight="600" dominant-baseline="middle">L1 and L2 caches</text><text x="680" y="238.0" font-family="'Roboto Mono', monospace" font-size="14" fill="#676d71" text-anchor="start" font-weight="500" dominant-baseline="middle">managed by the hardware</text><rect x="160.0" y="280" width="480" height="56" rx="6" fill="#f2f3f3" stroke="#d4dae4" stroke-width="1.5"/><text x="400" y="308.0" font-family="'Roboto Mono', monospace" font-size="16" fill="#020c13" text-anchor="middle" font-weight="600" dominant-baseline="middle">Global memory</text><text x="680" y="308.0" font-family="'Roboto Mono', monospace" font-size="14" fill="#676d71" text-anchor="start" font-weight="500" dominant-baseline="middle">every thread on the device</text><line x1="30" y1="336" x2="30" y2="70" stroke="#676d71" stroke-width="1.5"/><polygon points="30,70 33.1,77.4 26.9,77.4" fill="#676d71"/><text x="40" y="76" font-family="'Roboto Mono', monospace" font-size="12" fill="#676d71" text-anchor="start" font-weight="500" dominant-baseline="middle">Faster, smaller</text><text x="40" y="332" font-family="'Roboto Mono', monospace" font-size="12" fill="#676d71" text-anchor="start" font-weight="500" dominant-baseline="middle">Larger, slower</text><line x1="60" y1="366" x2="900" y2="366" stroke="#d4dae4" stroke-width="1.5" stroke-dasharray="6 6"/><text x="900" y="354" font-family="'Roboto Mono', monospace" font-size="12" fill="#676d71" text-anchor="end" font-weight="500" dominant-baseline="middle">device</text><text x="900" y="378" font-family="'Roboto Mono', monospace" font-size="12" fill="#676d71" text-anchor="end" font-weight="500" dominant-baseline="middle">host</text><rect x="160" y="394" width="480" height="56" rx="6" fill="#f2f3f3" stroke="#d4dae4" stroke-width="1.5"/><text x="400" y="422.0" font-family="'Roboto Mono', monospace" font-size="16" fill="#020c13" text-anchor="middle" font-weight="600" dominant-baseline="middle">Host memory</text><text x="680" y="422.0" font-family="'Roboto Mono', monospace" font-size="14" fill="#676d71" text-anchor="start" font-weight="500" dominant-baseline="middle">the CPU</text><line x1="670" y1="392" x2="670" y2="338" stroke="#637bff" stroke-width="1.5"/><polygon points="670,338 673.1,345.4 666.9,345.4" fill="#637bff"/><line x1="680" y1="338" x2="680" y2="392" stroke="#637bff" stroke-width="1.5"/><polygon points="680,392 676.9,384.6 683.1,384.6" fill="#637bff"/><text x="696" y="357.0" font-family="'Roboto Mono', monospace" font-size="14" fill="#637bff" text-anchor="start" font-weight="500" dominant-baseline="middle">enqueue_copy()</text></g>
