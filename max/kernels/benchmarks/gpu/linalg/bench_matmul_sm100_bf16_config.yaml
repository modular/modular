# Config sweep for the MiniMax-H3 DiT GEMMs (qkv N21504 K5376, out N5376
# K7168, down N5376 K14336) at the packed-row counts of a 4 s and a 15 s clip.
#
# One group per arm: `shape` covers the three linears, `$M` the two ends of
# the clip band. Every group pins each config knob to a single value, so kbench
# builds one executable per (arm, shape) and the CSV carries the knobs as
# columns.
#
#   kbench bench_matmul_sm100_bf16_config.yaml -o coarse.csv
#   kbench bench_matmul_sm100_bf16_config.yaml -o valid.csv \
#     --param '$M:"[33152,38272,48448,58688,73984,89216,109632,111680]"' \
#     --param 'mma_n:"[256]"' --param 'block_swizzle_size:"[8]"'
#
# Arm 0 is today's heuristic config (256x256, cta_group 2, cluster 2x1x1,
# block_swizzle 8, auto 6 stages), i.e. the baseline to beat. Arm 17 is the
# swapAB (output-transposed) variant.

name: bench_matmul_sm100_bf16_config
file: $KERNEL_BENCHMARKS_ROOT/gpu/linalg/bench_matmul_sm100_bf16_config.mojo

defaults: &defaults
  shape: [0, 1, 2]
  cta_group: 2
  cluster_x: 2
  cluster_y: 1
  block_swizzle_size: 8
  rasterize_order: 1
  k_group_size: 1
  num_clc_pipeline_stages: 2
  num_accum_pipeline_stages: 2
  num_pipeline_stages: 0
  swap_ab: False
  $M: [33152, 109632]

params:
# 0: the heuristic baseline (what production runs today).
- <<: *defaults
  mma_m: 256
  mma_n: 256

# 1-3: block swizzle width.
- <<: *defaults
  mma_m: 256
  mma_n: 256
  block_swizzle_size: 4

- <<: *defaults
  mma_m: 256
  mma_n: 256
  block_swizzle_size: 2

- <<: *defaults
  mma_m: 256
  mma_n: 256
  block_swizzle_size: 0

# 4: rasterize along N instead of along M.
- <<: *defaults
  mma_m: 256
  mma_n: 256
  rasterize_order: 0

# 5: 4-CTA cluster.
- <<: *defaults
  mma_m: 256
  mma_n: 256
  cluster_y: 2

# 6-10: tile shapes. 6 is the tile nvjet picks for qkv/out, 7 the transpose.
- <<: *defaults
  mma_m: 128
  mma_n: 256

- <<: *defaults
  mma_m: 256
  mma_n: 128

- <<: *defaults
  mma_m: 256
  mma_n: 192

- <<: *defaults
  mma_m: 256
  mma_n: 224

- <<: *defaults
  mma_m: 128
  mma_n: 128

# 11-12: k-grouped loads.
- <<: *defaults
  mma_m: 256
  mma_n: 256
  k_group_size: 2

- <<: *defaults
  mma_m: 256
  mma_n: 256
  k_group_size: 4

# 13: deeper candidate-launch pipeline.
- <<: *defaults
  mma_m: 256
  mma_n: 256
  num_clc_pipeline_stages: 4

# 14: single accumulator stage.
- <<: *defaults
  mma_m: 256
  mma_n: 256
  num_accum_pipeline_stages: 1

# 15-16: explicit stage counts instead of the auto-maximized 6.
- <<: *defaults
  mma_m: 256
  mma_n: 256
  num_pipeline_stages: 8

- <<: *defaults
  mma_m: 256
  mma_n: 256
  num_pipeline_stages: 10

# 17: output stored transposed (N-major tiles).
- <<: *defaults
  mma_m: 256
  mma_n: 256
  swap_ab: True

# 18-23: MiniMax-H3 gate_up, one GEMM over the fused gate+up projection
# (`F.linear(x[M, 5376], W[28672, 5376])`). Same K as qkv, twice the N, so the
# finalists of the qkv, out and down sweeps are the candidates: swapAB (qkv's
# pick) and the 256x224 tile (out's and down's pick), each against arm 0.
- <<: *defaults
  shape: [3]
  mma_m: 256
  mma_n: 256

- <<: *defaults
  shape: [3]
  mma_m: 256
  mma_n: 256
  swap_ab: True

- <<: *defaults
  shape: [3]
  mma_m: 256
  mma_n: 224

- <<: *defaults
  shape: [3]
  mma_m: 256
  mma_n: 224
  swap_ab: True

- <<: *defaults
  shape: [3]
  mma_m: 256
  mma_n: 256
  block_swizzle_size: 4

- <<: *defaults
  shape: [3]
  mma_m: 256
  mma_n: 256
  block_swizzle_size: 4
  swap_ab: True
