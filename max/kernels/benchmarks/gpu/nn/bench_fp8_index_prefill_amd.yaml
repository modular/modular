name: bench_fp8_index_prefill_amd
file: $KERNEL_BENCHMARKS_ROOT/gpu/nn/bench_fp8_index_prefill.mojo

params:
- num_heads: 32
  depth: 128
  page_size: 128
  $batch_size: 2
  $seq_len: 8192
  $cache_len: [8192, 80000]
  $kpool: 1
- num_heads: 32
  depth: 128
  page_size: 128
  $batch_size: 2
  $seq_len: 8192
  $cache_len: 80000
  $kpool: 4
- num_heads: 32
  depth: 128
  page_size: 128
  $batch_size: 2
  $seq_len: 8192
  $cache_len: 80000
  $kpool: 1
  $window_mb: 512
# Decode also lands on this scorer: 1 token per request on a short and a long
# cache, a few tokens per request, and a pooled cache.
- num_heads: 32
  depth: 128
  page_size: 128
  $batch_size: [8, 64]
  $seq_len: 1
  $cache_len: 8192
  $kpool: 1
- num_heads: 32
  depth: 128
  page_size: 128
  $batch_size: 8
  $seq_len: 1
  $cache_len: 80000
  $kpool: 1
- num_heads: 32
  depth: 128
  page_size: 128
  $batch_size: 64
  $seq_len: [2, 6]
  $cache_len: 8192
  $kpool: 1
- num_heads: 32
  depth: 128
  page_size: 128
  $batch_size: 64
  $seq_len: 1
  $cache_len: 8192
  $kpool: 4
