name: bench_mhc_post
file: $KERNEL_BENCHMARKS_ROOT/gpu/nn/bench_mhc_post.mojo

params:
# Decode, then prefill across the non-temporal threshold: 256 tokens on
# MI355X (1 per CU) and 1184 on B200 (8 per SM). Every run times both arms.
- $num_rows: [1, 16, 64, 256, 512, 768, 1024, 1184, 1185, 1280, 1536, 1792,
    2048, 2560, 3072, 4096, 8192, 16384]
