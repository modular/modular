name: bench_resize
file: $KERNEL_BENCHMARKS_ROOT/gpu/nn/bench_resize.mojo

params:
# Image upscale and downscale at a typical vision-encoder size.
- op: [nearest, linear, bicubic]
  dtype: [float32, bfloat16]
  in_shape: 1x3x224x224
  out_shape: [1x3x448x448, 1x3x112x112]

# Large batch of feature maps, 2x upscale as in a UNet decoder.
- op: [nearest, linear, bicubic]
  dtype: [float32, bfloat16]
  in_shape: 8x256x64x64
  out_shape: 8x256x128x128

# Small tensor: launch-bound.
- op: [nearest, linear, bicubic]
  dtype: float32
  in_shape: 1x3x16x16
  out_shape: 1x3x32x32
