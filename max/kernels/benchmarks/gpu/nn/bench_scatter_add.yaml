name: bench_scatter_add
file: $KERNEL_BENCHMARKS_ROOT/gpu/nn/bench_scatter_add.mojo

params:
# Control: the internal input->output copy on its own, at the volume of the
# `emb` case below. No patch touches this path, so both arms must agree.
- $mode: ["memcpy"]
  dtype: float32
  rows: 131072
  cols: 1024
  num_idx: 4096

# Many updates into few destination rows, writes coalesced down a row.
- $mode: ["emb"]
  dtype: float32
  rows: 131072
  cols: 1024
  num_idx: 4096

# Few updates into many destination rows, random 4-byte writes.
- $mode: ["spread"]
  dtype: float32
  rows: 131072
  cols: 1024
  num_idx: 4096

# Groups of 4 consecutive index rows repeat one destination row. At this
# geometry those rows are `cols` = 1024 elements apart in flat order, i.e.
# eight 128-thread blocks apart, so this is repeated destinations across
# blocks, not a collision inside one block. An intra-block collision along
# axis 0 is not reachable here: consecutive elements of one index row address
# different output elements by construction.
- $mode: ["dupblk"]
  dtype: float32
  rows: 131072
  cols: 1024
  num_idx: 4096

# The many-to-few pattern into a table that stays in cache, so the updates
# dominate instead of the input copy. `num_idx == rows` is the widest the
# graph shape function accepts along axis 0.
- $mode: ["emb"]
  dtype: float32
  rows: 1024
  cols: 4096
  num_idx: 1024

# Bound, not a candidate: the same indexes through the overwriting path, so
# the difference from the row above is the price of the atomics.
- $mode: ["emb_store"]
  dtype: float32
  rows: 1024
  cols: 4096
  num_idx: 1024

# The surviving rank-1 histogram: zeros in, ones updated at nondecreasing
# clipped segment ends, odd slot count.
- $mode: ["seg"]
  dtype: int32
  rows: 65537
  cols: 1
  num_idx: 1024

# The same at int64, which the speculative rollback path uses.
- $mode: ["seg64"]
  dtype: int64
  rows: 3001
  cols: 1
  num_idx: 256

# One slot per segment, so the clip piles the tail of the ends onto the last
# slot. `num_seg <= rows` because `scatter_elements_shape` rejects more index
# entries than output slots along the axis.
- $mode: ["seg"]
  dtype: int32
  rows: 257
  cols: 1
  num_idx: 256

# Reports how many distinct results the production geometry produces over 9
# reruns, then times it again.
- $mode: ["det_seg"]
  dtype: int32
  rows: 65537
  cols: 1
  num_idx: 1024
