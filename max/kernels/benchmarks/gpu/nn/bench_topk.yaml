name: bench_topk
file: $KERNEL_BENCHMARKS_ROOT/gpu/nn/bench_topk.mojo

params:

# TTS
- $N: [193856]
  $K: [1, 5, 10, 20, 30, 50, 75, 255]
  $batch_size: [1, 2, 4, 8, 16, 32, 64, 256]
  $fill_fn_name: ["fill_random"]
  out_idx_type: [DType.uint64]
  sampling: [True]

# gemma
- $N: [256000]
  $K: [1, 5, 10, 20, 30, 50, 75, 255]
  $batch_size: [1, 2, 4, 8, 16, 32, 64, 256]
  $fill_fn_name: ["fill_random"]
  out_idx_type: [DType.uint64]
  sampling: [True]

# llama
- $N: [128256]
  $K: [1, 5, 10, 20, 50, 75, 255]
  $batch_size: [1, 2, 4, 8, 16, 32, 64, 256]
  $fill_fn_name: ["fill_random"]
  out_idx_type: [DType.uint64]
  sampling: [True]

# FlashInfer path (softmax + dual-pivot rejection sampling)
# TTS
- $N: [193856]
  $K: [1, 5, 10, 20, 30, 50, 75, 255]
  $batch_size: [1, 2, 4, 8, 16, 32, 64, 256]
  $fill_fn_name: ["fill_random"]
  out_idx_type: [DType.uint64]
  sampling: [True]
  USE_FI_TOPK_KERNEL: [True]

# gemma - FI
- $N: [256000]
  $K: [1, 5, 10, 20, 30, 50, 75, 255]
  $batch_size: [1, 2, 4, 8, 16, 32, 64, 256]
  $fill_fn_name: ["fill_random"]
  out_idx_type: [DType.uint64]
  sampling: [True]
  USE_FI_TOPK_KERNEL: [True]

# llama - FI
- $N: [128256]
  $K: [1, 5, 10, 20, 30, 50, 75, 255]
  $batch_size: [1, 2, 4, 8, 16, 32, 64, 256]
  $fill_fn_name: ["fill_random"]
  out_idx_type: [DType.uint64]
  sampling: [True]
  USE_FI_TOPK_KERNEL: [True]

# Fused softmax + sampler from raw logits, no distribution: the kernel that
# runs one CTA per row and splits a row across a resident block group when the
# device has multiprocessors to spare. `num_coop_blocks=0` is the production
# path, which sizes the group from the device; 1 pins one block per row.
- $N: [128256, 256000]
  $K: [1, 50]
  $batch_size: [1, 8, 32, 128]
  $topp_dist: [True]
  $emit_dist: [False]
  $num_coop_blocks: [0]
  $in_dtype: ["bfloat16"]
  $fill_fn_name: ["fill_normal_hash"]
  out_idx_type: [DType.int64]

# Group-size sweep at the batches where the split changes the shape of a pass:
# one row leaves the device idle, eight rows start to fill it.
- $N: [128256, 256000]
  $K: [1, 50]
  $batch_size: [1, 8]
  $topp_dist: [True]
  $emit_dist: [False]
  $num_coop_blocks: [1, 2, 4, 8]
  $in_dtype: ["bfloat16"]
  $fill_fn_name: ["fill_normal_hash"]
  out_idx_type: [DType.int64]
