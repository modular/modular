# Stage 2's candidate ordering, on the llama vocabulary it serves.
#
# `dispatch=0` is the two-stage pair end to end (stage 1's scan plus stage 2's
# merge, as `_topk_gpu` launches them); `dispatch=3` is stage 2 alone on
# stage-1-shaped candidates. `K` covers the small-k shapes where the merge is a
# few candidates per block and the large ones where it is `num_blocks_per_input
# * K` elements.

name: bench_topk_stage2
file: $KERNEL_BENCHMARKS_ROOT/gpu/nn/bench_topk.mojo

params:
- $N: [128256]
  $K: [1, 5, 50, 75, 255]
  $batch_size: [1, 8, 64, 128]
  $fill_fn_name: ["fill_random"]
  $dispatch: [0, 3]
  out_idx_type: [DType.uint64]
  sampling: [True]
