name: bench_causal_conv1d_prefill
file: $KERNEL_BENCHMARKS_ROOT/gpu/state_space/bench_causal_conv1d_prefill.mojo

base: &base
  $dtype: [bfloat16, float32]
  $token_major: [False, True]

params:
- <<: *base
  $cohort: smoke
  $batch: 1
  $channels: 129
  $seqlen: 513
  $width: 4
  $silu: True
- <<: *base
  $cohort: prefill
  $batch: 1
  $channels: 1536
  $seqlen: [2048, 8192]
  $width: 4
  $silu: True
- <<: *base
  $cohort: controls
  $batch: 1
  $channels: 129
  $seqlen: [1, 3, 511]
  $width: 4
  $silu: [False, True]
- <<: *base
  $cohort: controls
  $batch: 1
  $channels: 129
  $seqlen: 513
  $width: 4
  $silu: False
- <<: *base
  $cohort: controls
  $batch: 4
  $channels: 129
  $seqlen: 512
  $width: 4
  $silu: [False, True]
- <<: *base
  $cohort: controls
  $batch: 1
  $channels: 129
  $seqlen: 513
  $width: [1, 2, 3]
  $silu: [False, True]
