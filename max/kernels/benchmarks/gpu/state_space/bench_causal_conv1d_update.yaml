name: bench_causal_conv1d_update
file: $KERNEL_BENCHMARKS_ROOT/gpu/state_space/bench_causal_conv1d_update.mojo

base: &base
  $dtype: [bfloat16, float32]
  $channels: 1536
  $width: 4
  $state_len: 4

params:
- <<: *base
  $cohort: smoke
  $batch: 1
  $seqlen: 1
- <<: *base
  $cohort: decode
  $batch: [4, 20]
  $seqlen: 1
- <<: *base
  $cohort: controls
  $batch: [1, 4, 20]
  $seqlen: [0, 3, 4, 8]
