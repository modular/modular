name: bench_gated_delta_verify
file: $KERNEL_BENCHMARKS_ROOT/gpu/state_space/bench_gated_delta_verify.mojo

base: &base
  $state_dtype: [bfloat16, float32]
  metadata:
    KEY_HEAD_DIM: 128
    VALUE_HEAD_DIM: 128
    RING_LEN: 8
  $value_heads: 48
  $key_heads: 16

params:
- <<: *base
  $cohort: smoke
  $batch: 1
  $window: 4
- <<: *base
  $cohort: verify
  $batch: 1
  $window: 8
- <<: *base
  $cohort: verify
  $batch: [4, 20]
  $window: [4, 8]
