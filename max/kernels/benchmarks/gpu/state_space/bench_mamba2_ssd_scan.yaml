name: bench_mamba2_ssd_scan
file: $KERNEL_BENCHMARKS_ROOT/gpu/state_space/bench_mamba2_ssd_scan.mojo

# All dimensions and sequence vectors are runtime parameters. The extra quotes
# preserve each vector as one kbench value rather than a flattened sweep.
# Paired controls require NVIDIA SM80+; AUTO enables grouped reuse only on B200.
# CSV rows are sample means. Indexed raw pairs and medians remain in stdout.
params:
- $cohort: smoke
  $ssd-heads: 32
  $ssd-head-dim: 64
  $ssd-groups: 4
  $sequence_lengths: "'[512]'"
  $ssd-kernel: dispatch

- $cohort: auto_grouped_h32_p64_g4_l512
  $ssd-heads: 32
  $ssd-head-dim: 64
  $ssd-groups: 4
  $sequence_lengths: "'[512]'"
  $ssd-kernel: auto-paired

- $cohort: auto_grouped_h32_p64_g4_l8192
  $ssd-heads: 32
  $ssd-head-dim: 64
  $ssd-groups: 4
  $sequence_lengths: "'[8192]'"
  $ssd-kernel: auto-paired

