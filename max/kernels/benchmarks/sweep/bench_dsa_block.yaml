# The DSA attention block of the prototype sweep: a 32-head FP8 indexer
# with top-k, then sparse MLA (decode for short sequences, the native-FP8
# prefill otherwise). A sweep runs one process per params group, and the
# comptime arms (`sweep_h` x `sweep_seq`: head count x decode-or-prefill)
# run in one executable; `--param sweep_h:"[8]"` pins one.
#
# Usage:
#   kbench bench_dsa_block.yaml --timeout-secs 600
#   kbench bench_dsa_block.yaml --param cache_len:"[0]"
#   kbench bench_dsa_block.yaml --param sweep_h:"[8]"

name: bench_dsa_block
file: $KERNEL_BENCHMARKS_ROOT/sweep/bench_dsa_block.mojo
sweep: true

params:

# cache_len 0 is the empty-cache prefill corner. seq_len 6 is the
# speculative-decode verify width and 8192 a prefill chunk; the batch is
# per phase (`--param '$decode_batch:...'` / `--param '$prefill_batch:...'`).
- $seq_len: [6, 8192]
  $cache_len: [32768, 0]
