# Nemotron-3.5-Lightning TP=2 decode attention qkv (M=64). Its fused epilogue
# looks up each row's sequence and KV-cache page before storing K and V, and
# that dominates. The heuristic's 2-SM 128x32 tile puts the 256 K/V columns on
# 8 CTAs with rows (their pair CTAs hold only rows past M); this 1-SM 64x16
# tile spreads them over 16. B200 serve, batch 64: 14.07 -> 11.06 us per call.
- <<: *defaults
  M: 64
  M_END: 65
  N: 2304
  K: 2688
  MMA_M: 64
  MMA_N: 16
  CTA_GROUP: 1
  CLUSTER_X: 1
  CLUSTER_Y: 1
  BLOCK_SWIZZLE_SIZE: 0
  RASTERIZE_ORDER: 1
  K_GROUP_SIZE: 2
  NUM_ACCUM_PIPELINE_STAGES: 1
  NUM_CLC_PIPELINE_STAGES: 0
# Eagle3 MLA draft qkv projection, N=2112 (q_a 1536 + kv_a 576), K=14336.
# One wave of 1-SM swap-AB tiles split 8 ways over K; each split stores its
# fp32 partial to its own workspace slot and every split reduces 1/8 of the
# tile (parallel split-K). Busy time per call on B200 vs cuBLAS (GEMM +
# split-K reduce kernels, its 32 MiB memset excluded): M=2 13.9 vs 14.9 us,
# M=32 14.2 vs 15.4, M=64 15.5 vs 18.9, M=96 16.7 vs 16.4, M=128 17.5 vs 17.3.
- <<: *defaults
  M: 1
  M_END: 17
  N: 2112
  K: 14336
  MMA_M: 128
  MMA_N: 16
  CTA_GROUP: 1
  CLUSTER_X: 1
  CLUSTER_Y: 1
  BLOCK_SWIZZLE_SIZE: 0
  RASTERIZE_ORDER: 1
  SWAP_AB: true
  K_GROUP_SIZE: 2
  NUM_ACCUM_PIPELINE_STAGES: 1
  NUM_CLC_PIPELINE_STAGES: 0
  NUM_SPLIT_K: 8
  NUM_PIPELINE_STAGES: 8
