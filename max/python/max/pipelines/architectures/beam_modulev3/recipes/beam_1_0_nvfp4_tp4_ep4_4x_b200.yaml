# 4x B200 recipe for Beam-1.0 NVFP4: attention tensor parallel over all four
# GPUs and the routed experts expert parallel over the same GPUs. Beam rejects
# any other EP size on more than one device.
model:
  model_path: reflection/Beam-1.0-501B-A23B-NVFP4
  device_specs: [0, 1, 2, 3]

runtime:
  prefer_module_v3: true
  ep_size: 4
  # The EP dispatch buffers are sized to max_batch_input_tokens, which only
  # chunked prefill enforces.
  enable_chunked_prefill: true
