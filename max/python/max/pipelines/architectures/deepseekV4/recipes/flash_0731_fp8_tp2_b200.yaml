# 2x B200 recipe for DeepSeek-V4-Flash-0731, native fp8 linears and fp4
# routed experts, tensor parallel across both GPUs.
model:
  model_path: deepseek-ai/DeepSeek-V4-Flash-0731
  huggingface_model_revision: 7872f01b1d1fe23eabc4c98b48bffcef5a386062
  huggingface_weight_revision: 7872f01b1d1fe23eabc4c98b48bffcef5a386062
  device_specs: [0, 1]
  quantization_encoding: float8_e4m3fn
  # Sizes the compressed-attention candidate axis, which is a graph shape.
  # TODO: derive max_length automatically. The prefill arena is now planned
  # (#100629, MXSERV-569), but two planner gaps remain: the weight estimate
  # counts the unloaded mtp.* tensors (~10 GiB), and the KV budget ignores
  # Jenga huge-page granularity (4.72 GiB pages, >= 8 per device). With the
  # defaults max_length is clamped to 1 and KV allocation fails.
  max_length: 4096

runtime:
  max_batch_size: 32
  # An 8192-token CE batch does not fit on 2x B200: per device, weights
  # (~79 GiB) + Jenga KV floor (37.8 GiB) + prefill arena (38.5 GiB) is
  # about 155 of the 160 GiB budget, so KV planning fails at startup.
  max_batch_input_tokens: 4096
