# 2x GPU recipe for Gemma 4 31B, tensor parallel across both GPUs. The 12B
# checkpoint has a single global KV head, so it cannot shard two ways.
model:
  model_path: google/gemma-4-31B-it
  device_specs: [0, 1]
  max_length: 8192
  kv_cache:
    device_memory_utilization: 0.75

# Compiles the language graph through device-graph synthesis: the compiled
# model records its kernels into a device graph and replays it on execute.
# With two devices the collectives between the shards (the embedding
# broadcast, the per-layer allreduces, the lm_head allgather) are recorded
# into the device graph as well. Mutually exclusive with device_graph_capture
# (this arch's default), which the config resolution disables when synthesis
# is set.
runtime:
  experimental_device_graph_synthesis: true
