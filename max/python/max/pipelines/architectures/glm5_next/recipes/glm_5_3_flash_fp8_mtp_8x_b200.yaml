# 8x B200 recipe for GLM-5.3-Flash with its MTP layer (K=3): text, image and
# video input.
#
# The base recipe beside glm5_next's, plus speculation. Prefix caching is
# forced off by the architecture: a recurrent state's checkpoints would be
# published at the wrong depth under speculation.
model:
  model_path: zai-org/GLM-5.3-Flash
  device_specs: [0, 1, 2, 3, 4, 5, 6, 7]
  data_parallel_degree: 1
  kv_cache:
    device_memory_utilization: 0.78

runtime:
  ep_size: 8
  max_batch_input_tokens: 8192
  max_batch_size: 32

sampling:
  enable_structured_output: true

speculative:
  speculative_method: mtp
  num_speculative_tokens: 3
