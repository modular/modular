# 8x B200 recipe for GLM-5.3-Flash, text-only.
#
# quantization_encoding is left unset so it resolves from the checkpoint's own
# blockwise-FP8 quantization_config, and max_length unset so the checkpoint's
# own value applies.
#
# The KV cache stays at its default dtype rather than float8_e4m3fn, unlike
# the GLM-5.3 NVFP4 recipe beside it. This checkpoint ships `kv_b_proj`
# unquantized, and the absorbed-scale pairing an FP8 latent cache needs does
# not exist for a BF16 `kv_b_proj` -- `Glm5NextSparseMLASublayer._attend`
# raises rather than run it.
#
# data_parallel_degree is 1, matching the rest of the GLM family here. That
# makes attention tensor-parallel, which is the configuration the residual's
# token sharding exists for: every per-token stage runs on one eighth of the
# batch and the EP dispatch buffers are sized from the same shard.
model:
  model_path: zai-org/GLM-5.3-Flash
  device_specs: [0, 1, 2, 3, 4, 5, 6, 7]
  data_parallel_degree: 1
  kv_cache:
    device_memory_utilization: 0.78

runtime:
  ep_size: 8
  max_batch_input_tokens: 8192
  # Well below the point where the gated-delta state-pool offsets stop fitting
  # in 32 bits; the KDA pools are 146 MiB per sequence regardless of context,
  # so concurrency is bounded by them rather than by the KV cache here.
  max_batch_size: 32

sampling:
  enable_structured_output: true
