# 2x MI355 recipe for GLM-5.3-Flash with its MTP layer (K=3) on ModuleV3,
# text-only.
#
# The ModuleV3 2x MI355 recipe beside this one, plus speculation. Prefix
# caching is forced off by the architecture: a recurrent state's checkpoints
# would be published at the wrong depth under speculation. At 0.82 of device
# memory the cache still holds a full 16K sequence beside the MTP layer.
model:
  model_path: zai-org/GLM-5.3-Flash
  device_specs: [0, 1]
  data_parallel_degree: 1
  max_length: 16384
  kv_cache:
    device_memory_utilization: 0.82

runtime:
  ep_size: 2
  max_batch_input_tokens: 8192
  prefer_module_v3: true

sampling:
  enable_structured_output: true

speculative:
  speculative_method: mtp
  num_speculative_tokens: 3
