# 8x B200 recipe for Hy4 VL (block FP8), after vLLM's serving line: tensor
# parallel 8, the checkpoint's DFly2 draft layers with five speculative tokens,
# a 262144-token context and a batch cap of 32. vLLM's B200 line serves 131072
# tokens; this recipe serves the 262144 that the Hy4 smoke run verified, and the
# benchmark catalog runs vLLM at the same length. `max serve` refuses Hy4:
# `max export --config-file` builds the pipeline artifact from this recipe, and
# Mach serves it (mach/docs/models/hy4.md).
#
# The defaults set the rest: the hy_v4 reasoning and tool parsers, one image
# per prompt, prefix caching and an 8192-token chunk. The graph splits the
# routed experts over the eight devices itself, so the recipe sets no ep_size.
# vLLM's FLASHMLA_SPARSE backend has no MAX flag; the sparse MLA kernel is the
# arch's own.
model:
  model_path: tencent/Hy4-FP8
  huggingface_model_revision: d063b5853ecf56e0776266dab28305fc17a137cc
  huggingface_weight_revision: d063b5853ecf56e0776266dab28305fc17a137cc
  device_specs: [0, 1, 2, 3, 4, 5, 6, 7]
  max_length: 262144

speculative:
  speculative_method: dfly
  num_speculative_tokens: 5

runtime:
  max_batch_size: 32
  # Without it, first-turn prefill steps block decode entirely.
  enable_in_flight_batching: true

# tool_choice required/named needs the grammar.
sampling:
  enable_structured_output: true
