# Kimi K3 (ModuleV3), TP8 on 8x MI355X: native MXFP4 routed experts,
# FP8 KV cache.
#
# Set MAX_KIMI_K3_AMD_W4A8=1 when launching: the recipe cannot set
# environment variables. Without it, the registry falls back to an
# unquantized matmul and fails on a shape mismatch.
model:
  model_path: moonshotai/Kimi-K3
  device_specs: [0, 1, 2, 3, 4, 5, 6, 7]
  data_parallel_degree: 1
  max_length: 16384
  trust_remote_code: true
  kv_cache:
    kv_cache_format: float8_e4m3fn
