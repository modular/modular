# 1x B200 recipe for Laguna S-2.1 (NVFP4). The architecture is single-GPU, so
# there is no parallelism section.
model:
  model_path: poolside/Laguna-S-2.1-NVFP4
  device_specs: [0]
  max_length: 262144  # The vendor's serving length; the checkpoint declares
                      # 1048576, which does not fit beside the weights on one
                      # B200.
