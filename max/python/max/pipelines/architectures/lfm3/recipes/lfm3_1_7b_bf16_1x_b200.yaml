# Matched eager envelope for the text model's KV and convolution-state caches.
model:
  model_path: LiquidAI/LFM3-1.7B
  device_specs: [0]
  max_length: 8192
  quantization_encoding: bfloat16
  kv_cache:
    kv_cache_format: bfloat16
    kv_cache_page_size: 128
    enable_prefix_caching: true
    device_memory_utilization: 0.6

runtime:
  prefer_module_v3: true
  max_batch_input_tokens: 8192
  enable_chunked_prefill: true
  device_graph_capture: false
  enable_overlap_scheduler: false
