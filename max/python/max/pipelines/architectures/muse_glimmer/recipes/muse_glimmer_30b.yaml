# One B200.
model:
  model_path: meta-models/Muse-Glimmer-30B

runtime:
  max_batch_size: 64
  enable_in_flight_batching: true

# tool_choice required/named and response_format need the grammar, and the
# arch cannot turn it on by default.
sampling:
  enable_structured_output: true
