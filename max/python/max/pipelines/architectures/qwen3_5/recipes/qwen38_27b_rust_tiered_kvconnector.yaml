# 1x B200 recipe for Qwen3.8-27B with the rust_tiered KV connector, so the
# smoke matrix exercises a hybrid's recurrent state through the host/disk
# tier.
model:
  model_path: Qwen/Qwen3.8-27B
  kv_cache:
    kv_connector_config:
      type: rust_tiered
      host_offload_max_gb: 50
      disk_offload_max_gb: 50
