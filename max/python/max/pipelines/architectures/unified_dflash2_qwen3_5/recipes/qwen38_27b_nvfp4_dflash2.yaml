# 1x B200 recipe for Qwen3.8-27B NVFP4 with the DFlash2 block drafter (a
# block of 8, so K=7).
model:
  model_path: RadixArk/Qwen3.8-27B-NVFP4
  device_specs: [0]
  trust_remote_code: true
  max_length: 9216
  kv_cache:
    kv_cache_format: float8_e4m3fn
    device_memory_utilization: 0.7

draft_model:
  model_path: z-lab/Qwen3.8-27B-DFlash2
  device_specs: [0]
  trust_remote_code: true
  quantization_encoding: bfloat16

runtime:
  max_batch_size: 16
  max_batch_input_tokens: 8192

speculative:
  speculative_method: dflash2
