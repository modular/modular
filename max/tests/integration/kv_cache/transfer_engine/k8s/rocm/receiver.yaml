# AMD variant of the NIXL KV-transfer smoke receiver (mirrors ../receiver.yaml).
# Differences from the NVIDIA/EFA pod: AMD GPUs and the UCX (rocm-verbs)
# transport instead of libfabric/EFA. This UCX lane runs over the pod network
# (no RDMA device requested, so it does not need the RoCE fabric); the
# follow-up adds the RoCE IB fabric (modular.com/rdma_ib_device, the CI analog
# of the Coder "Enable RoCE networking" flag) for the UCCL backend.

apiVersion: v1
kind: Service
metadata:
  name: kv-smoke-receiver
spec:
  selector:
    app: kv-smoke-receiver
  ports:
    - name: placeholder
      port: 1
      targetPort: 1
  clusterIP: None

---

apiVersion: batch/v1
kind: Job
metadata:
  name: kv-smoke-receiver
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app: kv-smoke-receiver
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ecr-secret
      # Force receiver onto a different node than the sender.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: kv-smoke-sender
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: amd.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
        - name: test-script
          configMap:
            name: kv-smoke-script
      containers:
        - name: receiver
          image: ENGINE_IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - >-
              python /smoke/test_transfer_engine_cross_node.py
              --role receiver
              --sender-addr tcp://kv-smoke-sender:5555
              --backend ucx
              ${SMOKE_EXTRA_ARGS}
          env:
            - name: SMOKE_EXTRA_ARGS
              value: EXTRA_ARGS_PLACEHOLDER
            # UCX (rocm-verbs) is the AMD default backend today; set
            # explicitly to match the NVIDIA pod's explicit libfabric selection
            # and to be unambiguous in logs.
            - name: MODULAR_NIXL_TRANSFER_BACKEND
              value: ucx
            - name: MODULAR_DEVICE_CONTEXT_MEMORY_MANAGER_SIZE_PERCENT
              value: "90"
          resources:
            limits:
              amd.com/gpu: "1"
              memory: 243200Mi
            requests:
              amd.com/gpu: "1"
              cpu: 22250m   # guarantee scheduling; no CPU limit so transfers can burst
              memory: 243200Mi
          securityContext:
            # IPC_LOCK: RDMA memory pinning. NET_ADMIN: RDMA device access.
            capabilities:
              add:
                - IPC_LOCK
                - NET_ADMIN
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: test-script
              mountPath: /smoke
