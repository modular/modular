[package]
name = "kv-core-pyo3"
version = "0.1.0"
edition = "2024"
publish = false
description = "Python bindings for kv-core, shipped in the max wheel as max._kv_core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kv-core = { path = "../kv-core" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
# Registered only so the Bazel rust_pyo3_toolchain's mandatory
# pyo3_introspection attribute is satisfied (stubs = False here).
pyo3-introspection = "0.29"

[build-dependencies]
pyo3-build-config = "0.29"

[lints.rust]
warnings = "deny"
unsafe_code = "deny"
unreachable_pub = "deny"
let_underscore_drop = "deny"
unused_qualifications = "deny"

[lints.clippy]
# correctness & safety
dbg_macro = "deny"
needless_bool = "deny"
needless_match = "deny"
needless_pass_by_value = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

# pattern matching hygiene
redundant_guards = "deny"
redundant_pattern = "deny"
redundant_pattern_matching = "deny"
single_match_else = "deny"

# style & readability
allow_attributes_without_reason = "deny"
cloned_instead_of_copied = "deny"
str_to_string = "deny"
uninlined_format_args = "deny"

# Workspace root for the open-sourced kv-core crates (MXSERV-665); kv-core is
# pulled in by path. Kept out of //rust_kv's workspace so the export resolves
# without mach.
[workspace]
