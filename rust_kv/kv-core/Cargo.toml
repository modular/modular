[package]
name = "kv-core"
version = "0.1.0"
edition = "2024"
# Bazel builds Rust 1.94.0, the oldest toolchain that has to compile this crate.
rust-version = "1.94"
publish = false
description = "Host-side KV cache bookkeeping shared by MAX Serve and Mach."

[lib]
crate-type = ["rlib"]

[lints.rust]
warnings = "deny"
unsafe_code = "deny"
unreachable_pub = "deny"
let_underscore_drop = "deny"
unused_qualifications = "deny"

[lints.clippy]
# correctness & safety
dbg_macro = "deny"
needless_bool = "deny"
needless_match = "deny"
needless_pass_by_value = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

# pattern matching hygiene
redundant_guards = "deny"
redundant_pattern = "deny"
redundant_pattern_matching = "deny"
single_match_else = "deny"

# style & readability
allow_attributes_without_reason = "deny"
cloned_instead_of_copied = "deny"
str_to_string = "deny"
uninlined_format_args = "deny"
